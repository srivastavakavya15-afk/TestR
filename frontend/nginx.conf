server {
    listen 80;
    # The stock image's entrypoint only adds this when the config is unmodified, and ours is — so
    # declare it here, otherwise `localhost` (which resolves to ::1 first) is refused in-container.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable defers the lookup to request time — with a
    # literal upstream, nginx resolves once at startup and then caches that IP until reloaded, so
    # restarting the api container would break the proxy.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Serving the SPA and the API from one origin means the API needs no CORS policy.
    location /api/ {
        set $api_host api;
        proxy_pass http://$api_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        set $api_host api;
        proxy_pass http://$api_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths must return index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames make them safe to cache indefinitely; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
